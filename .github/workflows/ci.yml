name: Factory starter CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  build-and-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - run: npm run build
      - run: npm run qa
      - run: npm run qa:production
      - run: npm run journal:check
      - run: npm run scaffold:check
