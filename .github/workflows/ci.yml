name: Factory starter CI
permissions:
  contents: write
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  lock-bootstrap:
    if: ${{ hashFiles('package-lock.json') == '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install --package-lock-only
      - name: Commit lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "WF-002C: add reproducible npm lockfile"
          git push
  build-and-qa:
    if: ${{ hashFiles('package-lock.json') != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run qa
      - run: npm run qa:production
      - run: npm run journal:check
      - run: npm run scaffold:check
      - run: npm run acceptance
